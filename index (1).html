<script>
/* Diagnóstico inicial: roda antes de tudo e mostra erros no lobby */
(function(){
  function show(m){var c=document.getElementById('cst');if(c)c.textContent=m}
  addEventListener('error',function(e){show('Erro no app: '+(e.message||'desconhecido')+(e.lineno?' (linha '+e.lineno+')':''))});
  addEventListener('unhandledrejection',function(e){show('Erro no app: '+((e.reason&&e.reason.message)||e.reason||'desconhecido'))});
  setTimeout(function(){var c=document.getElementById('cst');
    if(c&&c.textContent==='Conectando ao servidor…')show('O app não iniciou. Atualize o arquivo index.html no Render e recarregue.');},6000);
})();
</script>

<style>
:root{--bg:#120f0e;--p1:#1f1814;--p2:#2a201a;--br:#7d5f35;--au:#d9ae52;--rd:#7e1b1b;--rd2:#b23a3a;--tx:#ece1cc;--mu:#a39380}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background-color:var(--bg);background-image:radial-gradient(ellipse at 50% 0,#3a1713,#120f0e 70%),repeating-linear-gradient(45deg,#ffffff07 0 2px,#0000 2px 6px);background-attachment:fixed;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header,main{max-width:640px;margin:auto;padding-left:12px;padding-right:12px}
header{padding-top:max(14px,env(safe-area-inset-top));padding-bottom:4px}
h1,h2,.ser{font-family:Cinzel,Georgia,serif;font-weight:700}
h1{color:var(--au);font-size:22px;margin:0 0 10px;text-align:center}
.hb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
h2{color:var(--au);font-size:16px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--br)}
.card{background:linear-gradient(var(--p2),var(--p1));border:1px solid var(--br);border-radius:10px;padding:14px;margin:12px 0;box-shadow:inset 0 0 0 1px #0008,0 2px 8px #0006}

.f{display:block;font-size:13px;color:var(--mu);min-width:0}.f input,.f select,.f .ro{margin-top:3px}
input,select{width:100%;min-height:44px;padding:8px 10px;background:#0f0c0b;color:var(--tx);border:1px solid #5b4630;border-radius:8px;font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--au);outline-offset:1px}
input::placeholder{color:#d9ae52aa}
.btn{min-height:44px;min-width:44px;padding:8px 12px;background:linear-gradient(#5a1d1d,var(--rd));color:#f4dfae;border:1px solid var(--rd2);border-radius:8px;font-family:inherit;font-size:14px;font-weight:600}
.btn:active{transform:scale(.97)}.wide{width:100%;margin-top:10px}
.mu{color:var(--mu);font-size:14px;margin:8px 0 0}.au{color:var(--au)}
.phc{display:flex;flex-direction:column;align-items:center;gap:12px}
.ov{position:absolute;inset:0;width:100%;height:100%;min-height:0;padding:0;border:0;opacity:0;cursor:pointer;z-index:2}
.frame{position:relative;width:168px;height:168px;border-radius:50%;border:4px double var(--au);box-shadow:0 0 0 3px #000,0 0 22px #b23a3a55;background:#0f0c0b;display:grid;place-items:center;overflow:hidden;text-align:center;color:var(--mu);font-size:14px;padding:22px;cursor:pointer}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.attr{background:#120d0b;border:1px solid var(--br);border-radius:10px;padding:8px 6px;text-align:center;min-width:0}
.attr .ser{font-size:12.5px;color:var(--mu);display:block}
.attr b{display:block;font:700 30px Cinzel,Georgia,serif;color:var(--au);margin:2px 0 4px}
.attr input{text-align:center;font-size:18px;padding:4px}
.bar{position:relative;height:26px;background:#0f0c0b;border:1px solid var(--br);border-radius:13px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(#c24040,var(--rd));transition:width .25s}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;text-shadow:0 1px 2px #000}
.qa{display:grid;grid-template-columns:96px 1fr;gap:6px 8px;align-items:center;padding:8px 0;border-bottom:1px dashed #5b463066}
.qb{grid-column:1/-1;display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:6px}
.ro{min-height:44px;display:grid;place-items:center;background:#0f0c0b;border:1px solid #5b4630;border-radius:8px;font:700 20px Cinzel,Georgia,serif;color:var(--au)}
input[type=checkbox]{accent-color:var(--au);width:26px;height:26px;min-height:0;padding:0;flex:none}
.ds{display:flex;align-items:center;gap:12px;margin:8px 0}.ds span{width:84px}
.ds input{appearance:none;-webkit-appearance:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--br);background:#0f0c0b}

.sk,.skh{display:grid;grid-template-columns:54px 1fr 44px 44px;align-items:center;gap:6px}
.sk{min-height:46px;border-bottom:1px dashed #5b463066}.sk input{margin:auto}.sk .ex{accent-color:var(--rd2)}
.skh{font-size:11px;color:var(--mu);text-align:center}
.sk .bn{font:700 18px Cinzel,Georgia,serif;color:var(--au);text-align:center}.sk small{color:var(--mu);margin-left:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;border-bottom:1px dashed #5b463077;align-items:center}
.row input[data-f]:not([type=checkbox]){flex:1 1 84px;min-width:0;width:auto}.row .w2{flex:2 1 150px!important}.row .x{flex:none;padding:0}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;flex:none}
.stat{background:#120d0b;border:1px solid var(--br);border-radius:10px;padding:10px;text-align:center;font-size:13px;color:var(--mu)}
.stat b{display:block;font:700 28px Cinzel,Georgia,serif;color:var(--au)}
.slot{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed #5b463055}
.slot .ser{width:28px;color:var(--au)}.slot input{width:62px;flex:none;text-align:center}
.bxs{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.sbx{width:38px;height:38px;border-radius:8px;border:2px solid var(--au);background:var(--au);padding:0}.sbx.sp{background:#0f0c0b;border-color:#5b4630}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#0d0a09f2;border-top:1px solid var(--br);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{background:none;border:0;color:var(--mu);min-height:60px;font-size:12px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button span{font-size:20px}nav [aria-selected=true]{color:var(--au);box-shadow:inset 0 3px 0 var(--rd2)}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--rd);color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
section[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Tema papel impresso ===== */
:root{--bg:#e8dcc0;--p1:#f3ead2;--p2:#f6eed8;--br:#2b2118;--au:#7a1f1f;--rd:#7a1f1f;--rd2:#7a1f1f;--tx:#2b2118;--mu:#66553f}

.btn{background:#f3ead2;color:var(--tx);border:2px solid var(--br);border-radius:3px;box-shadow:2px 2px 0 var(--br)}

.bar i{background:repeating-linear-gradient(45deg,#7a1f1f 0 6px,#92302b 6px 12px)}

.qa,.sk,.row,.slot{border-bottom:1px solid #2b211866}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--br);border-radius:50%;background:transparent}
input[type=checkbox]:checked{background:radial-gradient(var(--br) 0 52%,transparent 58%)}

.ds .ok:checked,.ds .ko:checked{background:var(--br);border-color:var(--br)}

#toast{background:var(--br);color:#f3ead2}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.hidden { display: none !important; }
/* ===== v2.0: mesa multiplayer ===== */
textarea{width:100%;min-height:70px;padding:8px 4px;background:transparent;color:var(--tx);border:0;border-bottom:1.5px solid var(--br);font:inherit;resize:vertical}
.cs{display:inline-flex;gap:8px;align-items:center;margin:0 auto;padding:4px 12px;border:2px solid var(--br);border-radius:16px;background:#f9f2de;font-size:14px}

#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}#app[hidden]{display:none}
#top{flex:none;padding:max(8px,env(safe-area-inset-top)) 10px 6px;background:#e8dcc0f5;border-bottom:3px double var(--br);display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:6}
#rc{font:700 20px Cinzel,Georgia,serif;letter-spacing:3px;background:#f9f2de;border:2px solid var(--br);padding:2px 10px;border-radius:3px}

.pgrid{display:grid;gap:4px 12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));padding:8px 12px 30px;max-width:1000px;margin:auto}
.ph{display:flex;gap:10px;align-items:center}.ph>div:nth-child(2){flex:1;min-width:0}
.av{width:44px;height:44px;border-radius:50%;border:2px solid var(--br);background:#f9f2de center/cover;display:grid;place-items:center;font:700 18px Cinzel,Georgia,serif;flex:none}
.ca{border:2px solid var(--br);border-radius:8px 8px 16px 16px;padding:2px 8px;text-align:center;background:#f9f2de;font-size:11px}.ca b{display:block;font:700 20px Cinzel,Georgia,serif;color:var(--au)}
.pc .bar{margin:10px 0 8px}.pc .qb .btn{padding:4px}

.tok{position:absolute;border-radius:50%;border:3px solid var(--br);background:#f9f2de center/cover;display:grid;place-items:center;font:700 calc(var(--s)*.45) Cinzel,Georgia,serif;color:var(--au);transform:translate(-50%,-50%);touch-action:none;z-index:2}

<body>
<div id="lobby" class="intro"><div class="iw">
<div class="dice" aria-hidden="true">⚄</div><h1>Mesa de D&amp;D 5e <small class="ver">v2.0.0</small></h1>
<div id="cs" class="cs"><i class="dot"></i><span id="cst">Conectando ao servidor…</span></div>
<div class="card" style="text-align:left"><h2>Criar nova mesa</h2><p class="mu" style="margin:0 0 10px">Você será o Mestre (DM) e receberá um código de 4 letras para compartilhar.</p><button class="btn pri" id="mk">Criar Nova Mesa</button></div>
<div class="card" style="text-align:left"><h2>Entrar em mesa</h2><div class="g2">
<label class="f s2">Código da mesa<input id="jc" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD" style="text-transform:uppercase;letter-spacing:6px;font-size:22px;text-align:center"></label>
<label class="f s2">Ficha a usar<select id="js"></select></label>
<label class="f s2">Nome do personagem<input id="jn" maxlength="40" placeholder="Ex.: Thorin"></label></div>
<button class="btn pri wide" id="jb">Entrar como Jogador</button></div>
<div class="card" style="text-align:left"><h2>Restaurar mesa salva</h2><p class="mu" style="margin:0 0 10px">Use o arquivo de backup (.json) que você salvou pelo botão 💾 Salvar do Mestre.</p><button class="btn wide" id="rb">📂 Restaurar mesa de arquivo</button><input type="file" id="rf" accept=".json,application/json" hidden></div>
<p class="err" id="le" role="alert"></p></div></div>
<div id="app" hidden><div id="top"><b id="rc"></b><button class="btn" id="cp">Copiar</button><span class="badge" id="rl"></span><i class="dot" id="cs2"></i><span class="sp"></span><button class="btn dmo" id="svb" hidden>💾 Salvar</button><button class="btn hidden" id="btnInstall">📲 Instalar App</button><button class="btn" id="lv">Sair</button><div id="tabs"></div></div>
<div id="v-sheet" class="view" hidden><header>
  <h1>Ficha de D&amp;D 5e <small class="ver">v2.0.0</small></h1>
  <div class="chr"><select id="chars" aria-label="Escolher ficha"></select><button class="btn" id="newc">Nova ficha</button><button class="btn" id="delc">Excluir</button></div>
  <div class="hb">
    <button class="btn" id="exp">Exportar Ficha (.JSON)</button>
    <button class="btn" id="imp">Importar Ficha (.JSON)</button>
    <input type="file" id="impf" accept=".json,application/json" hidden>
  </div>
</header>
<main>
  <section id="geral"></section><section id="combate" hidden></section><section id="pericias" hidden></section>
  <section id="itens" hidden></section><section id="magia" hidden></section>
</main>
<nav id="nav" aria-label="Seções da ficha"></nav></div>
<div id="v-dm" class="view" hidden><div id="pg" class="pgrid"></div></div>
<div id="v-map" class="view" hidden><div id="mv"><div id="world"><img id="mimg" alt="" hidden><div id="grid"></div><svg id="rsv"></svg><div id="ml"></div><div id="tl"></div><div id="rlab" class="rlab" hidden></div></div></div>
<div class="ctl"><button class="btn" id="zi" aria-label="Aproximar">+</button><button class="btn" id="zo" aria-label="Afastar">−</button><button class="btn" id="cen" aria-label="Centralizar no personagem">◎</button><button class="btn" id="rul" aria-label="Medir distância">📏</button>
<button class="btn dmo" id="pin" aria-label="Adicionar marcador" hidden>📌</button><button class="btn dmo" id="mup-b" aria-label="Carregar mapa" hidden>🖼</button><button class="btn dmo" id="cel" aria-label="Tamanho do quadrado" hidden>▦</button></div>
<input type="file" id="mup" accept="image/png,image/jpeg" hidden><div id="bs"></div></div></div>
<aside id="dr" aria-label="Ficha do jogador"></aside>
<script src="/socket.io/socket.io.js"></script>
<div id="toast" role="status"></div>
<script>
(()=>{'use strict';
/* ===== Utilidades ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const num=v=>parseInt(v,10)||0,mod=v=>Math.floor((num(v)-10)/2),sg=n=>(n>=0?'+':'')+n;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)};

/* ===== Dados do sistema ===== */
const KEY='dnd5e-ficha-v1';
const AT=[['for','Força'],['des','Destreza'],['con','Constituição'],['int','Inteligência'],['sab','Sabedoria'],['car','Carisma']];
const SH={for:'FOR',des:'DES',con:'CON',int:'INT',sab:'SAB',car:'CAR'};
const SK=[['Acrobacia','des'],['Arcana','int'],['Atletismo','for'],['Atuação','car'],['Blefar/Enganação','car'],['Furtividade','des'],['História','int'],['Intimidação','car'],['Intuição','sab'],['Investigação','int'],['Lidar com Animais','sab'],['Medicina','sab'],['Natureza','int'],['Percepção','sab'],['Persuasão','car'],['Prestidigitação','des'],['Religião','int'],['Sobrevivência','sab']];
const LISTS={
  atk:[['n','Nome','text','w2'],['b','Bônus','text'],['d','Dano','text'],['t','Tipo de dano','text']],
  inv:[['n','Item','text','w2'],['q','Qtd','number'],['w','Peso','number']],
  spells:[['n','Magia','text','w2'],['l','Nível','number'],['p','Preparada','checkbox']]};
const NEW={atk:{n:'',b:'',d:'',t:''},inv:{n:'',q:1,w:0},spells:{n:'',l:1,p:false}};

/* ===== Estado e persistência ===== */
const def=()=>({f:{},a:{for:10,des:10,con:10,int:10,sab:10,car:10},hp:{cur:0,max:0,tmp:0},c:{ca:10,ini:'',vel:'9 m'},hd:{tot:1,used:0,die:'d8'},ds:{},sk:{},atk:[],inv:[],coin:{},sp:{ab:'',slots:{}},spells:[],photo:''});
const merge=(d,r)=>{for(const k in r){if(r[k]&&typeof r[k]==='object'&&!Array.isArray(r[k])&&d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))merge(d[k],r[k]);else d[k]=r[k]}return d};
const rd=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const IDX='dnd5e-fichas',ck=id=>KEY+':'+id,uid=()=>Math.random().toString(36).slice(2,8);
let X=rd(IDX)||{list:[],cur:null};
if(!X.list.length){const o=rd(KEY);if(o&&(o.done||o.f?.nome)){const id=uid();localStorage.setItem(ck(id),JSON.stringify(o));X={list:[{id,n:o.f?.nome||'Personagem'}],cur:id};localStorage.setItem(IDX,JSON.stringify(X))}}
const load=()=>{const r=X.cur&&rd(ck(X.cur));return r&&typeof r==='object'?merge(def(),r):def()};
let S=load();
function rSel(){const s=$('#chars');if(s)s.innerHTML=X.list.length?X.list.map(c=>`<option value="${c.id}"${c.id===X.cur?' selected':''}>${esc(c.n||'Sem nome')}</option>`).join(''):'<option>Nenhuma ficha</option>'}
function save(){if(window.__R){window.__R(S);return}try{if(X.cur){localStorage.setItem(ck(X.cur),JSON.stringify(S));const e=X.list.find(c=>c.id===X.cur);if(e)e.n=S.f.nome||'Sem nome'}localStorage.setItem(IDX,JSON.stringify(X));rSel();window.onSheetSave&&window.onSheetSave()}catch(e){toast('Sem espaço para salvar. Exporte a ficha em .JSON.')}}
function newChar(o){const id=uid();X.list.push({id,n:''});X.cur=id;S=o?merge(def(),o):def();save()}
const get=p=>p.split('.').reduce((o,k)=>o?.[k],S);
const set=(p,v)=>{const ks=p.split('.'),l=ks.pop();ks.reduce((o,k)=>(o[k]??={}),S)[l]=v};

/* ===== Construção da interface ===== */
const I=(p,l,t='text',c='',x='')=>`<label class="f ${c}">${l}<input data-p="${p}" type="${t}"${t==='number'?' inputmode="numeric"':''} ${x}></label>`;
const Q=(p,l,ds=[-5,-1,1,5])=>`<div class="qa"><span class="ser">${l}</span><input data-p="${p}" type="number" inputmode="numeric" aria-label="${l}"><div class="qb" style="--n:${ds.length}">${ds.map(d=>`<button class="btn" data-adj="${p}" data-d="${d}">${sg(d)}</button>`).join('')}</div></div>`;
const DS=(k,c,l)=>`<div class="ds"><span>${l}</span>${[0,1,2].map(i=>`<input type="checkbox" class="${c}" data-p="ds.${k}${i}" aria-label="${l} ${i+1}">`).join('')}</div>`;

const T=[['geral','⚄','Geral'],['combate','⚔','Combate'],['pericias','≛','Perícias'],['itens','☰','Inventário'],['magia','꩜','Magias']];
$('#nav').innerHTML=T.map(([id,ic,l])=>`<button data-tab="${id}"><span>${ic}</span>${l}</button>`).join('');

$('#geral').innerHTML=`
<div class="card phc"><div class="frame"><img id="pimg" alt="Foto do personagem" hidden><span id="pph">Toque para adicionar foto</span><input id="ph" class="ov" type="file" accept="image/*" aria-label="Escolher foto do personagem"></div></div>
<div class="card"><h2>Identidade</h2><div class="g2">
${I('f.nome','Nome do personagem','text','s2')}${I('f.raca','Raça')}${I('f.classe','Classe')}
${I('f.nivel','Nível','number','','min="1" max="20"')}${I('f.xp','Experiência (XP)','number')}
${I('f.antecedente','Antecedente')}${I('f.tendencia','Tendência')}</div></div>
<div class="card"><h2>Atributos</h2><div class="g3">${AT.map(([k,n])=>`<div class="attr"><span class="ser">${n}</span><b id="m-${k}">+0</b><input data-p="a.${k}" type="number" inputmode="numeric" min="1" max="30" aria-label="${n}"></div>`).join('')}</div></div>
<div class="card"><h2>Condições e efeitos</h2><div class="chips">${['Agarrado','Amedrontado','Atordoado','Caído','Cego','Contido','Encantado','Envenenado','Incapacitado','Inconsciente','Invisível','Paralisado','Petrificado','Surdo'].map(c=>`<label class="chip"><input type="checkbox" data-p="cond.${c.toLowerCase()}"><span>${c}</span></label>`).join('')}</div>${Q('cond.exa','Exaustão',[-1,1])}${I('f.efeitos','Outros efeitos (magias, bênçãos, maldições)','text','',' style="margin-top:6px"')}</div>`;

$('#combate').innerHTML=`
<div class="card"><h2>Pontos de vida</h2><div class="bar"><i id="hpbar"></i><span id="hptxt"></span></div>${Q('hp.cur','Atual')}${Q('hp.max','Máximo')}${Q('hp.tmp','Temporário')}</div>
<div class="card"><h2>Estatísticas de combate</h2><div class="g2">
${I('c.ca','Classe de Armadura','number')}${I('c.ini','Iniciativa (auto se vazio)','text','',' inputmode="numeric"')}${I('c.vel','Deslocamento')}
<div class="f">Bônus de proficiência<div class="ro" id="pb">+2</div></div>
<div class="f s2">Percepção passiva<div class="ro" id="pp">10</div></div></div></div>
<div class="card"><h2>Dados de Vida</h2><div class="g2"><div class="f">Disponíveis<div class="ro" id="hdL">1 / 1</div></div>
<label class="f">Tipo de dado<select data-p="hd.die">${['d6','d8','d10','d12'].map(d=>`<option>${d}</option>`).join('')}</select></label></div>
${Q('hd.tot','Total',[-1,1])}${Q('hd.used','Gastos',[-1,1])}</div>
<div class="card"><h2>Testes de morte</h2>${DS('s','ok','Sucessos')}${DS('f','ko','Falhas')}</div>
<button class="btn wide" id="rest">Descanso longo</button>`;

$('#pericias').innerHTML=`<div class="card"><h2>Perícias</h2>
<p class="mu" style="margin:0 0 8px">Proficiência: <b class="au" id="pb2">+2</b>. Maestria dobra o bônus.</p>
<div class="skh"><span></span><span></span><span>Prof.</span><span>Maest.</span></div>
${SK.map(([n,a])=>`<div class="sk"><b class="bn">+0</b><span>${n}<small>${SH[a]}</small></span><input type="checkbox" data-sk="${n}" data-t="p" aria-label="Proficiência em ${n}"><input type="checkbox" class="ex" data-sk="${n}" data-t="e" aria-label="Maestria em ${n}"></div>`).join('')}</div>`;

$('#itens').innerHTML=`
<div class="card"><h2>Ataques e magias de ataque</h2><div id="l-atk"></div><button class="btn wide" data-add="atk">Adicionar ataque</button></div>
<div class="card"><h2>Inventário e equipamentos</h2><div id="l-inv"></div><button class="btn wide" data-add="inv">Adicionar item</button><p class="mu">Peso total: <b class="au" id="wt">0</b></p></div>
<div class="card"><h2>Bolsa de moedas</h2><div class="g3">${[['cp','Cobre (CP)'],['sp','Prata (SP)'],['ep','Electro (EP)'],['gp','Ouro (GP)'],['pp','Platina (PP)']].map(([k,n])=>I('coin.'+k,n,'number')).join('')}</div>
<p class="mu">Valor total: <b class="au" id="gold">0</b> po</p></div>`;

$('#magia').innerHTML=`
<div class="card"><h2>Conjuração</h2><label class="f">Atributo de conjuração<select data-p="sp.ab"><option value="">Nenhum</option>${AT.filter(a=>['int','sab','car'].includes(a[0])).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></label>
<div class="g2" style="margin-top:10px"><div class="stat">CD de resistência<b id="cd">-</b></div><div class="stat">Bônus de ataque mágico<b id="ma">-</b></div></div></div>
<div class="card"><h2>Espaços de magia</h2><p class="mu" style="margin:0 0 6px">Informe o total de cada nível e toque nas caixas para gastar ou recuperar.</p>
${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="slot"><span class="ser">${n}º</span><input data-p="sp.slots.${n}.max" type="number" inputmode="numeric" min="0" max="9" aria-label="Total de espaços do ${n}º nível"><div class="bxs" id="sb${n}"></div></div>`).join('')}
<button class="btn wide" id="rslots">Recuperar todos os espaços</button></div>
<div class="card"><h2>Magias conhecidas e preparadas</h2><div id="l-spells"></div><button class="btn wide" data-add="spells">Adicionar magia</button></div>`;

/* ===== Listas dinâmicas ===== */
function rList(k){
  $('#l-'+k).innerHTML=S[k].map((it,i)=>`<div class="row" data-k="${k}" data-i="${i}">${LISTS[k].map(([f,pl,t,c])=>t==='checkbox'
    ?`<label class="chk"><input type="checkbox" data-f="${f}"${it[f]?' checked':''}>${pl}</label>`
    :`<input class="${c||''}" data-f="${f}" type="${t}"${t==='number'?' inputmode="decimal" step="any"':''} placeholder="${pl}" aria-label="${pl}" value="${esc(it[f]??'')}">`).join('')}<button class="btn x" data-del aria-label="Remover">✕</button></div>`).join('')||'<p class="mu">Nada por aqui ainda.</p>';
}

/* ===== Cálculos automáticos ===== */
const SM=n=>{const s=S.sp.slots[n]||{},m=Math.min(Math.max(num(s.max),0),20);return[m,Math.min(Math.max(num(s.used),0),m)]};
function calc(){
  const pb=Math.floor((Math.max(1,num(S.f.nivel))-1)/4)+2;let pp=10;
  AT.forEach(([k])=>$('#m-'+k).textContent=sg(mod(S.a[k])));
  $('#pb').textContent=$('#pb2').textContent=sg(pb);
  $('[data-p="c.ini"]').placeholder=sg(mod(S.a.des));
  const mx=num(S.hp.max),cu=num(S.hp.cur),tp=num(S.hp.tmp);
  $('#hpbar').style.width=(mx>0?Math.min(100,Math.max(0,cu/mx*100)):0)+'%';
  $('#hptxt').textContent=`${cu} / ${mx}`+(tp?` (+${tp} temp.)`:'');
  $('#hdL').textContent=`${Math.max(0,num(S.hd.tot)-num(S.hd.used))} / ${num(S.hd.tot)} ${S.hd.die}`;
  $$('.sk').forEach((r,i)=>{const[n,a]=SK[i],o=S.sk[n]||{},b=mod(S.a[a])+(o.e?2*pb:o.p?pb:0);
    $('.bn',r).textContent=sg(b);$('[data-t=p]',r).checked=!!o.p;$('[data-t=e]',r).checked=!!o.e;if(n==='Percepção')pp=10+b});
  $('#pp').textContent=pp;
  const ab=S.sp.ab,sm=ab?mod(S.a[ab]):0;
  $('#cd').textContent=ab?8+pb+sm:'-';$('#ma').textContent=ab?sg(pb+sm):'-';
  for(let n=1;n<10;n++){const[m,u]=SM(n);
    $('#sb'+n).innerHTML=Array.from({length:m},(_,i)=>`<button class="sbx${i>=m-u?' sp':''}" data-slot="${n}" data-i="${i}" aria-label="Espaço ${i+1} do ${n}º nível, ${i>=m-u?'gasto':'disponível'}"></button>`).join('')}
  $('#wt').textContent=Math.round(S.inv.reduce((t,i)=>t+num(i.q)*(parseFloat(i.w)||0),0)*100)/100;
  const c=S.coin;$('#gold').textContent=Math.round((num(c.cp)/100+num(c.sp)/10+num(c.ep)/2+num(c.gp)+num(c.pp)*10)*100)/100;
}
function photo(){const i=$('#pimg');i.hidden=!S.photo;if(S.photo)i.src=S.photo;$('#pph').hidden=!!S.photo}
const fill=()=>$$('[data-p]').forEach(e=>{const v=get(e.dataset.p);if(e.type==='checkbox')e.checked=!!v;else e.value=v??''});
function renderAll(){rSel();['atk','inv','spells'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[];rList(k)});fill();photo();calc()}
function tab(id){$$('main section').forEach(s=>s.hidden=s.id!==id);$$('#nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===id));$('#v-sheet').scrollTo(0,0)}

/* ===== Eventos ===== */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.p)set(t.dataset.p,t.type==='checkbox'?t.checked:t.value);
  else if(t.dataset.f){const r=t.closest('.row');S[r.dataset.k][r.dataset.i][t.dataset.f]=t.type==='checkbox'?t.checked:t.value}
  else if(t.dataset.sk){const o=(S.sk[t.dataset.sk]??={});o[t.dataset.t]=t.checked;if(t.dataset.t==='e'&&t.checked)o.p=true;if(t.dataset.t==='p'&&!t.checked)o.e=false}
  else return;
  save();calc();
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.tab)return tab(d.tab);
  if(d.adj){let v=Math.max(0,num(get(d.adj))+num(d.d));if(d.adj==='hp.cur'&&num(S.hp.max)>0)v=Math.min(v,num(S.hp.max));if(d.adj==='cond.exa')v=Math.min(v,6);set(d.adj,v);fill();save();calc();return}
  if(d.add){S[d.add].push({...NEW[d.add]});rList(d.add);save();calc();return}
  if(t.hasAttribute('data-del')){const r=t.closest('.row');S[r.dataset.k].splice(r.dataset.i,1);rList(r.dataset.k);save();calc();return}
  if(d.slot){const[m,u]=SM(d.slot),i=num(d.i);(S.sp.slots[d.slot]??={}).used=i>=m-u?m-i-1:m-i;save();calc()}
});
$('#rslots').onclick=()=>{for(const n in S.sp.slots)S.sp.slots[n].used=0;save();calc();toast('Espaços de magia recuperados')};
$('#rest').onclick=()=>{S.hp.cur=num(S.hp.max);S.hp.tmp=0;S.hd.used=Math.max(0,num(S.hd.used)-Math.max(1,Math.floor(num(S.hd.tot)/2)));S.ds={};for(const n in S.sp.slots)S.sp.slots[n].used=0;save();fill();calc();toast('Descanso longo concluído')};

/* Foto: redimensiona para 360px e salva em Base64 */
$('#ph').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const s=360,c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(im.width,im.height);
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);S.photo=c.toDataURL('image/jpeg',.85);const t=document.createElement('canvas');t.width=t.height=72;t.getContext('2d').drawImage(c,0,0,72,72);S.thumb=t.toDataURL('image/jpeg',.7);save();photo()};
    im.onerror=()=>toast('Não foi possível ler essa imagem. Tente uma foto JPG ou PNG.');im.src=r.result};
  r.onerror=()=>toast('Falha ao abrir o arquivo.');
  r.onloadend=()=>{e.target.value=''};
  r.readAsDataURL(f);
});

/* Exportar e importar */
$('#exp').onclick=async()=>{const json=JSON.stringify(S,null,2),nm=`ficha-${(S.f.nome||'personagem').replace(/[^\w\-]+/g,'_')}.json`;
  let d=null;try{d=window.claude?await window.claude.use('downloads'):null}catch(x){}
  if(d){try{await d.save({filename:nm,data:json});toast('Ficha exportada')}catch(x){if(!x||x.code!=='declined')toast('Não foi possível exportar a ficha.')}return}
  const b=new Blob([json],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=nm;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Ficha exportada')};
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;newChar(o);S.done=true;save();renderAll();$('#intro').hidden=true;tab('geral');toast('Ficha importada como nova ficha')}
    catch(x){toast('Arquivo inválido. Escolha um .json exportado por este app.')}};
  r.readAsText(f);e.target.value=''};

/* ===== Introdução: boas-vindas e criação do personagem ===== */
const intro=document.createElement('div');intro.id='intro';intro.className='intro';intro.hidden=true;
intro.innerHTML=`<div class="iw" id="w1"><div class="dice" aria-hidden="true">⚄</div><h1>Bem-vindo, aventureiro!</h1>
<p>Esta é a ficha do seu personagem de D&amp;D 5e. Vamos começar criando o seu: leva só um minuto, e depois você pode alterar tudo.</p>
<button class="btn pri" id="go">Fazer personagem</button><button class="lnk" id="old">Já tenho uma ficha salva (.JSON)</button></div>
<div class="iw left" id="w2" hidden><h1>Crie seu personagem</h1><p>Preencha o que já souber. Nada é definitivo: tudo pode ser alterado na ficha depois.</p>
<div class="card"><h2>Identidade</h2><div class="g2">${I('f.nome','Nome do personagem','text','s2')}${I('f.raca','Raça')}${I('f.classe','Classe')}${I('f.nivel','Nível','number','','min="1" max="20"')}${I('f.antecedente','Antecedente')}${I('f.tendencia','Tendência','text','s2')}</div></div>
<div class="card"><h2>Atributos</h2><div class="g3">${AT.map(([k,n])=>`<label class="f">${n}<input data-p="a.${k}" type="number" inputmode="numeric" min="1" max="30"></label>`).join('')}</div></div>
<div class="card"><h2>Vida e defesa</h2><div class="g2">${I('hp.max','Pontos de vida máximos','number')}${I('c.ca','Classe de Armadura','number')}${I('c.vel','Deslocamento','text','s2')}</div></div>
<div class="sticky"><button class="btn pri" id="fin">Abrir minha ficha</button></div></div>`;
document.body.appendChild(intro);
$('#go').onclick=()=>{if(!X.cur)newChar();$('#w1').hidden=true;$('#w2').hidden=false;fill();intro.scrollTo(0,0)};
$('#old').onclick=()=>$('#impf').click();
$('#fin').onclick=()=>{if(!num(S.f.nivel))S.f.nivel=1;if(!num(S.hp.cur)&&num(S.hp.max))S.hp.cur=num(S.hp.max);S.hd.tot=Math.max(1,num(S.f.nivel));S.done=true;save();fill();calc();intro.hidden=true;tab('geral');toast('Ficha pronta! Você pode editar tudo.')};
renderAll();tab('geral');
const wiz=()=>{intro.hidden=false;$('#w1').hidden=true;$('#w2').hidden=false;fill();intro.scrollTo(0,0)};

$('#newc').onclick=()=>{save();newChar();renderAll();wiz()};
$('#chars').onchange=e=>{save();X.cur=e.target.value;S=load();save();renderAll();intro.hidden=true;tab('geral');toast('Ficha trocada')};
let dc=0;$('#delc').onclick=e=>{const b=e.currentTarget;if(!X.cur)return;if(!dc){b.textContent='Confirmar?';dc=setTimeout(()=>{dc=0;b.textContent='Excluir'},3000);return}clearTimeout(dc);dc=0;b.textContent='Excluir';localStorage.removeItem(ck(X.cur));X.list=X.list.filter(c=>c.id!==X.cur);X.cur=X.list[0]?.id||null;S=load();save();renderAll();if(X.cur)tab('geral');else{intro.hidden=false;$('#w1').hidden=false;$('#w2').hidden=true}toast('Ficha excluída')};
let Sbk;
window.FX={toast,
  edit(sh,cb){Sbk=S;S=merge(def(),sh);window.__R=cb;renderAll();tab('geral')},
  end(){window.__R=null;S=Sbk;renderAll()},
  replace(sh){const k={photo:S.photo,thumb:S.thumb};S=Object.assign(merge(def(),sh),k);save();renderAll()},
  list:()=>X,name:()=>S.f.nome||'',tab,
  setName(n){if(n&&n!==S.f.nome){S.f.nome=n;save();fill()}},
  select(id){save();X.cur=id;S=load();save();renderAll();tab('geral')},
  create(n){save();newChar();S.f.nome=n;S.done=true;save();renderAll();tab('geral')},
  snap(){const o=JSON.parse(JSON.stringify(S));delete o.photo;delete o.thumb;return{name:S.f.nome||'Jogador',sheet:o,avatar:S.thumb||''}},
  patch(p){if(p.hp&&p.hp.cur!=null)S.hp.cur=p.hp.cur;save();fill();calc()}};
})();
</script>
<script>(()=>{'use strict';
/* ===== Mesa multiplayer: rede, painel do Mestre e mapa ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const num=v=>parseInt(v,10)||0,sg=n=>(n>=0?'+':'')+n,mod=v=>Math.floor((num(v)-10)/2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FX=window.FX,toast=FX.toast;
const AT=[['for','Força'],['des','Destreza'],['con','Constituição'],['int','Inteligência'],['sab','Sabedoria'],['car','Carisma']];
const MK=[['🍺','Taverna'],['⚠️','Armadilha'],['☠️','Chefe'],['💰','Tesouro'],['📍','Local']];
const icon=t=>(MK.find(m=>m[1]===t)||MK[4])[0];
const N={code:null,role:null,pid:null,token:null,players:[],markers:[]};
const M={x:0,y:0,k:1,w:2000,h:1500,cell:50,img:'',mode:'nav'};
const SESS='dnd5e-sessao';
const store=()=>localStorage.setItem(SESS,JSON.stringify({code:N.code,role:N.role,token:N.token,pid:N.pid}));
const sock=typeof io==='function'?io({reconnectionDelay:500,reconnectionDelayMax:3000}):(()=>{const d={connected:false,on(){return d},emit(){}};setTimeout(()=>{const c=document.getElementById('cst');if(c){c.textContent='Erro: a conexão com o servidor não foi carregada. Recarregue a página.';}},300);return d})();
const setCS=(on,msg)=>{$('#cs').classList.toggle('on',on);$('#cs2').classList.toggle('on',on);$('#cst').textContent=msg};
const err=m=>{$('#le').textContent=m||''};

/* ---- Lobby ---- */
function fillSel(){const X=FX.list();$('#js').innerHTML=X.list.map(c=>`<option value="${c.id}"${c.id===X.cur?' selected':''}>${esc(c.n||'Sem nome')}</option>`).join('')+'<option value="__new">➕ Nova ficha</option>';selChg()}
function selChg(){const v=$('#js').value,c=FX.list().list.find(c=>c.id===v);$('#jn').value=c?c.n:'';$('#jn').placeholder=c?'':'Nome do novo personagem'}
$('#js').onchange=selChg;fillSel();
$('#jc').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
$('#mk').onclick=()=>{err();sock.emit('room:create',null,r=>{if(!r?.ok)return err('Não foi possível criar a mesa.');
  N.code=r.code;N.role='dm';N.token=r.token;store();enter(r.state);toast('Mesa criada! Código: '+r.code)})};
$('#jb').onclick=()=>{err();const code=$('#jc').value.trim(),v=$('#js').value;let name=$('#jn').value.trim();
  if(code.length!==4)return err('Digite o código de 4 caracteres.');
  if(v==='__new'&&!name)return err('Digite o nome do personagem.');
  if(!name)name=FX.list().list.find(c=>c.id===v)?.n||'Jogador';
  sock.emit('room:join',{code,name},r=>{if(!r?.ok)return err(r?.error||'Falha ao entrar.');
    v==='__new'?FX.create(name):(FX.select(v),FX.setName(name));
    N.code=r.code;N.role='player';N.pid=r.pid;store();enter(r.state);sendSheet()})};
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(N.code)}catch(e){const t=document.createElement('textarea');t.value=N.code;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast('Código '+N.code+' copiado!')};
$('#lv').onclick=()=>{if(N.role==='dm'&&!confirm('Sair da mesa? Você pode perder o controle de Mestre.'))return;localStorage.removeItem(SESS);location.reload()};

/* ---- Conexão ---- */
sock.on('connect',()=>{setCS(true,'Conectado ao servidor');const s=JSON.parse(localStorage.getItem(SESS)||'null');
  if(s?.code)sock.emit('room:rejoin',{code:s.code,role:s.role,token:s.token,pid:s.pid},r=>{
    if(r?.ok){Object.assign(N,s);enter(r.state);if(N.role==='player'&&!r.pending)sendSheet()}
    else{localStorage.removeItem(SESS);if(!$('#app').hidden)location.reload();else err(r?.error||'')}})});
sock.on('disconnect',()=>setCS(false,'Desconectado. Reconectando…'));
sock.on('connect_error',()=>setCS(false,'Servidor indisponível…'));
setCS(false,'Conectando ao servidor…');
/* Diagnóstico: mostra erros de script e tempo de espera na própria tela */
const showErr=m=>{$('#cst').textContent=m};
addEventListener('error',e=>showErr('Erro no app: '+(e.message||'desconhecido')));
addEventListener('unhandledrejection',e=>showErr('Erro no app: '+(e.reason?.message||e.reason||'desconhecido')));
setTimeout(async()=>{if(sock.connected)return;showErr('Sem resposta do servidor. Verificando…');
  try{const r=await fetch('/health',{cache:'no-store'});showErr(r.ok?'Servidor respondeu, conexão em andamento. Recarregue a página.':'Servidor respondeu com erro '+r.status)}
  catch(x){showErr('Não foi possível alcançar o servidor. Verifique a internet ou aguarde o Render acordar.')}},8000);

function enter(s){
  N.players=s.players;N.markers=s.markers;Object.assign(M,s.map);
  $('#lobby').hidden=true;$('#app').hidden=false;
  $('#rc').textContent=N.code;$('#rl').textContent=N.role==='dm'?'MESTRE':'JOGADOR';
  const T=N.role==='dm'?[['dm','Mesa'],['map','Mapa']]:[['sheet','Ficha'],['map','Mapa']];
  $('#tabs').innerHTML=T.map(([v,l])=>`<button class="btn" data-v="${v}">${l}</button>`).join('');
  $$('.dmo').forEach(b=>b.hidden=N.role!=='dm');
  view(T[0][0]);setMap();renderDM();
}
let mapShown=false;
function view(v){['sheet','dm','map'].forEach(x=>$('#v-'+x).hidden=x!==v);
  $$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
  if(v==='map'&&!mapShown){mapShown=true;setTimeout(fit,30)}}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-v]');if(b){if(ed)endEdit();view(b.dataset.v)}};

/* ---- Jogador: envia ficha ---- */
let st,quiet=false;const sendSheet=()=>{if(N.role==='player'&&sock.connected)sock.emit('sheet:sync',FX.snap())};
window.onSheetSave=()=>{if(N.role!=='player'||quiet)return;clearTimeout(st);st=setTimeout(sendSheet,250)};

/* ---- Painel do Mestre ---- */
const hpOf=p=>{const h=p.sheet?.hp||{};return{cu:num(h.cur),mx:num(h.max),tp:num(h.tmp)}};
const bar=p=>{const{cu,mx,tp}=hpOf(p);return`<div class="bar"><i style="width:${mx>0?Math.min(100,Math.max(0,cu/mx*100)):0}%"></i><span>${cu} / ${mx}${tp?` (+${tp})`:''}</span></div>`};
const hpBtns=p=>`<div class="qb" style="--n:4">${[-5,-1,1,5].map(d=>`<button class="btn" data-hp="${p.id}" data-d="${d}">${sg(d)}</button>`).join('')}</div>`;
const av=p=>`<div class="av"${p.avatar?` style="background-image:url('${p.avatar}')"`:''}>${p.avatar?'':esc((p.name||'?')[0].toUpperCase())}</div>`;
function renderDM(){if(N.role!=='dm')return;const sc=$('#v-dm').scrollTop;
  $('#pg').innerHTML=N.players.map(p=>{const f=p.sheet?.f||{};
    return`<div class="card pc"><div class="ph">${av(p)}<div><b>${esc(p.name)}</b> <i class="dot${p.online?' on':''}"></i><div class="mu" style="margin:0">${esc([f.raca,f.classe,f.nivel&&'Nv '+f.nivel].filter(Boolean).join(' · '))||'Ficha vazia'}</div></div><div class="ca"><span>CA</span><b>${esc(p.sheet?.c?.ca??'-')}</b></div></div>${bar(p)}${hpBtns(p)}<button class="btn wide" data-open="${p.id}">Abrir ficha completa</button></div>`}).join('')
  ||`<p class="mu" style="grid-column:1/-1;text-align:center;padding:30px 10px">Aguardando jogadores…<br>Código da mesa: <b class="au" style="font-size:26px;letter-spacing:4px">${N.code}</b></p>`;
  $('#v-dm').scrollTop=sc}
let dr=null;
function renderDr(){const p=N.players.find(x=>x.id===dr);if(!p)return;const s=p.sheet,f=s?.f||{};
  const L=(a,fn)=>a?.length?a.map(fn).join(''):'<p class="mu">—</p>',kv=(k,v)=>`<div class="kv"><span>${k}</span><b>${esc(v||'—')}</b></div>`;
  if(!s){$('#dr').innerHTML=`<div class="dh"><h2 style="margin:0;flex:1;background:none;color:var(--tx);padding:0">${esc(p.name)}</h2><button class="btn" data-close>Fechar</button></div><p class="mu">Este jogador ainda não enviou a ficha. Você pode criar a ficha dele daqui.</p><button class="btn wide" data-edit="${p.id}">✎ Editar ficha completa</button>`;return}
  const pb=Math.floor((Math.max(1,num(f.nivel))-1)/4)+2,cond=Object.entries(s.cond||{}).filter(([k,v])=>v===true).map(([k])=>k),sl=Object.entries(s.sp?.slots||{}).filter(([n,v])=>num(v.max)>0);
  $('#dr').innerHTML=`<div class="dh"><h2 style="margin:0;flex:1;background:none;color:var(--tx);padding:0">${esc(p.name)}</h2><button class="btn" data-close>Fechar</button></div>
<button class="btn wide" data-edit="${p.id}" style="margin-top:12px">✎ Editar ficha completa</button>
<div class="card" style="margin-top:14px"><h2>Pontos de vida</h2>${bar(p)}${hpBtns(p)}</div>
<div class="card"><h2>Identidade</h2>${kv('Raça',f.raca)}${kv('Classe',f.classe)}${kv('Nível',f.nivel)}${kv('XP',f.xp)}${kv('Antecedente',f.antecedente)}${kv('Tendência',f.tendencia)}</div>
<div class="card"><h2>Atributos</h2><div class="g3">${AT.map(([k,n])=>`<div class="attr"><span class="ser">${n}</span><b>${sg(mod(s.a?.[k]))}</b><div>${num(s.a?.[k])}</div></div>`).join('')}</div></div>
<div class="card"><h2>Combate</h2>${kv('Classe de Armadura',s.c?.ca)}${kv('Iniciativa',s.c?.ini||sg(mod(s.a?.des)))}${kv('Deslocamento',s.c?.vel)}${kv('Bônus de proficiência',sg(pb))}${kv('Dados de Vida',`${Math.max(0,num(s.hd?.tot)-num(s.hd?.used))}/${num(s.hd?.tot)} ${s.hd?.die||''}`)}</div>
<div class="card"><h2>Condições</h2>${cond.map(c=>`<span class="tag">${esc(c)}</span>`).join('')||'<p class="mu">Nenhuma</p>'}${num(s.cond?.exa)?kv('Exaustão',s.cond.exa):''}${f.efeitos?kv('Efeitos',f.efeitos):''}</div>
<div class="card"><h2>Ataques</h2>${L(s.atk,a=>kv(a.n,`${a.b||''} ${a.d||''} ${a.t||''}`))}</div>
<div class="card"><h2>Magias</h2>${sl.map(([n,v])=>kv(n+'º nível',`${num(v.max)-Math.min(num(v.used),num(v.max))}/${num(v.max)}`)).join('')}${L(s.spells,m=>kv(m.n,`${m.l}º${m.p?' ✓':''}`))}</div>
<div class="card"><h2>Inventário</h2>${L(s.inv,i=>kv(i.n,`x${i.q||1}`))}${kv('Moedas',['cp','sp','ep','gp','pp'].map(k=>num(s.coin?.[k])+k).join(' '))}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.hp)sock.emit('dm:hp',{pid:d.hp,delta:num(d.d)});
  else if(d.edit)startEdit(d.edit);
  else if(d.open){dr=d.open;renderDr();$('#dr').classList.add('on')}
  else if('close' in d){dr=null;$('#dr').classList.remove('on')}});

/* ---- Mapa ---- */
const mv=$('#mv'),wd=$('#world');let ruler=null,g=null,lastEmit=0;
function apply(){wd.style.transform=`translate(${M.x}px,${M.y}px) scale(${M.k})`;wd.style.setProperty('--inv',1/M.k);if(ruler)drawRuler()}
function fit(){const r=mv.getBoundingClientRect();if(!r.width)return;M.k=Math.min(r.width/M.w,r.height/M.h);M.x=(r.width-M.w*M.k)/2;M.y=(r.height-M.h*M.k)/2;apply()}
function zoomAt(cx,cy,f){const k=Math.min(8,Math.max(.1,M.k*f));f=k/M.k;M.x=cx-(cx-M.x)*f;M.y=cy-(cy-M.y)*f;M.k=k;apply()}
const toW=e=>{const r=mv.getBoundingClientRect();return{x:(e.clientX-r.left-M.x)/M.k,y:(e.clientY-r.top-M.y)/M.k}};
function glide(fn){wd.style.transition='transform .35s ease';fn();setTimeout(()=>wd.style.transition='',380)}
function setMap(){wd.style.width=M.w+'px';wd.style.height=M.h+'px';const i=$('#mimg');i.hidden=!M.img;if(M.img)i.src=M.img;
  $('#grid').style.backgroundSize=M.cell+'px '+M.cell+'px';renderTok();renderMk()}
const pos=(p,i)=>p.tok||{x:M.w/2+(i-(N.players.length-1)/2)*M.cell*1.3,y:M.h/2};
function renderTok(){if(g?.t==='drag')return;const s=Math.round(M.cell*.9);
  $('#tl').innerHTML=N.players.map((p,i)=>{const q=pos(p,i);return`<div class="tok${p.id===N.pid?' me':''}${p.online?'':' off'}" data-pid="${p.id}" style="left:${q.x}px;top:${q.y}px;width:${s}px;height:${s}px;--s:${s}px;${p.avatar?`background-image:url('${p.avatar}')`:''}">${p.avatar?'':esc((p.name||'?')[0].toUpperCase())}<em>${esc(p.name)}</em></div>`}).join('')}
function renderMk(){$('#ml').innerHTML=N.markers.map(m=>`<div class="mk" data-id="${m.id}" style="left:${m.x}px;top:${m.y}px">${icon(m.type)}</div>`).join('')}
$('#zi').onclick=()=>{const r=mv.getBoundingClientRect();glide(()=>zoomAt(r.width/2,r.height/2,1.5))};
$('#zo').onclick=()=>{const r=mv.getBoundingClientRect();glide(()=>zoomAt(r.width/2,r.height/2,1/1.5))};
mv.addEventListener('wheel',e=>{e.preventDefault();const r=mv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15)},{passive:false});
mv.addEventListener('contextmenu',e=>e.preventDefault());
let ci=-1;$('#cen').onclick=()=>{let i;if(N.role==='player')i=N.players.findIndex(x=>x.id===N.pid);else{ci=(ci+1)%Math.max(1,N.players.length);i=ci}
  const p=N.players[i];if(!p)return toast('Nenhum personagem no mapa');const q=pos(p,i),r=mv.getBoundingClientRect();
  glide(()=>{M.k=Math.max(M.k,Math.min(2,r.width/(M.cell*8)));M.x=r.width/2-q.x*M.k;M.y=r.height/2-q.y*M.k;apply()});if(N.role==='dm')toast('Centralizado em '+p.name)};
function mode(m){M.mode=M.mode===m?'nav':m;$('#rul').classList.toggle('act',M.mode==='ruler');$('#pin').classList.toggle('act',M.mode==='pin');
  if(M.mode!=='ruler'){ruler=null;drawRuler()}
  if(M.mode==='ruler')toast('Toque e arraste para medir');if(M.mode==='pin')toast('Toque no mapa para criar um marcador')}
$('#rul').onclick=()=>mode('ruler');$('#pin').onclick=()=>mode('pin');
function drawRuler(){const s=$('#rsv'),l=$('#rlab');if(!ruler){s.innerHTML='';l.hidden=true;return}
  const{a,b}=ruler,sq=Math.hypot(b.x-a.x,b.y-a.y)/M.cell;
  s.innerHTML=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#7a1f1f" stroke-width="3" stroke-dasharray="9 6" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="${a.x}" cy="${a.y}" r="${6/M.k}" fill="#7a1f1f"/><circle cx="${b.x}" cy="${b.y}" r="${6/M.k}" fill="#7a1f1f"/>`;
  l.hidden=false;l.style.left=(a.x+b.x)/2+'px';l.style.top=(a.y+b.y)/2+'px';
  l.textContent=`${Math.round(sq*10)/10} quad. · ${Math.round(sq*5)} pés · ${Math.round(sq*15)/10} m`}

/* Gestos: arrastar, pinça, régua, mover token (Mestre) */
const P=new Map();
const dist=()=>{const a=[...P.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
const mid=()=>{const a=[...P.values()],r=mv.getBoundingClientRect();return{x:(a[0].x+a[1].x)/2-r.left,y:(a[0].y+a[1].y)/2-r.top}};
mv.addEventListener('pointerdown',e=>{if(e.target.closest('.ctl,#bs'))return;mv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(P.size===2){g={t:'pinch',d:dist(),m:mid()};return}if(P.size>2)return;
  const tk=e.target.closest('.tok'),w=toW(e);
  if(M.mode==='ruler'){ruler={a:w,b:w};drawRuler();g={t:'ruler'}}
  else if(tk&&N.role==='dm'){g={t:'drag',el:tk,pid:tk.dataset.pid}}
  else g={t:'pan',sx:e.clientX,sy:e.clientY,ox:M.x,oy:M.y,mv:0,w,tg:e.target}});
mv.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!g)return;
  if(g.t==='pinch'){if(P.size===2){const d=dist(),m=mid();M.x+=m.x-g.m.x;M.y+=m.y-g.m.y;zoomAt(m.x,m.y,d/g.d);g.d=d;g.m=m}}
  else if(g.t==='ruler'){ruler.b=toW(e);drawRuler()}
  else if(g.t==='drag'){const w=toW(e);g.el.style.left=w.x+'px';g.el.style.top=w.y+'px';g.x=w.x;g.y=w.y;const n=Date.now();if(n-lastEmit>60){lastEmit=n;sock.emit('token:move',{pid:g.pid,x:w.x,y:w.y})}}
  else if(g.t==='pan'){const dx=e.clientX-g.sx,dy=e.clientY-g.sy;g.mv=Math.max(g.mv,Math.hypot(dx,dy));M.x=g.ox+dx;M.y=g.oy+dy;apply()}});
const up=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);
  if(g?.t==='drag'&&g.x!=null){sock.emit('token:move',{pid:g.pid,x:g.x,y:g.y});const p=N.players.find(p=>p.id===g.pid);if(p)p.tok={x:g.x,y:g.y}}
  else if(g?.t==='pan'&&g.mv<6&&e.type==='pointerup')tap(g);
  if(g?.t==='pinch'&&P.size>0)return;g=null};
mv.addEventListener('pointerup',up);mv.addEventListener('pointercancel',up);
function tap(g){const mk=g.tg.closest?.('.mk');if(mk)return openMk(N.markers.find(m=>m.id===mk.dataset.id));
  if(M.mode==='pin'&&N.role==='dm')return mkForm(null,g.w);closeBs()}

/* Marcadores */
const bs=$('#bs'),closeBs=()=>bs.classList.remove('on');
function openMk(m){if(!m)return;bs.innerHTML=`<h3>${icon(m.type)} ${esc(m.title)}</h3><p>${esc(m.desc)||'Sem descrição.'}</p><div class="g2">${N.role==='dm'?`<button class="btn" data-act="edit" data-id="${m.id}">Editar</button><button class="btn" data-act="del" data-id="${m.id}">Excluir</button>`:''}<button class="btn${N.role==='dm'?' s2':' s2'}" data-act="x">Fechar</button></div>`;bs.classList.add('on')}
function mkForm(m,w){bs.innerHTML=`<h3>${m?'Editar marcador':'Novo marcador'}</h3><label class="f">Tipo<select id="mt">${MK.map(([i,n])=>`<option value="${n}"${m?.type===n?' selected':''}>${i} ${n}</option>`).join('')}</select></label>
<label class="f">Título<input id="mti" maxlength="60" value="${esc(m?.title||'')}" placeholder="Ex.: Taverna do Javali"></label><label class="f">Descrição<textarea id="md" maxlength="500">${esc(m?.desc||'')}</textarea></label>
<div class="g2" style="margin-top:10px"><button class="btn" data-act="x">Cancelar</button><button class="btn pri" data-act="save" data-id="${m?.id||''}" data-x="${w?.x||0}" data-y="${w?.y||0}">Salvar</button></div>`;bs.classList.add('on')}
bs.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset;
  if(d.act==='x')closeBs();
  else if(d.act==='edit')mkForm(N.markers.find(m=>m.id===d.id));
  else if(d.act==='del'){sock.emit('marker:remove',{id:d.id});closeBs()}
  else if(d.act==='save'){const o={type:$('#mt').value,title:$('#mti').value.trim()||'Marcador',desc:$('#md').value.trim()};
    d.id?sock.emit('marker:update',{id:d.id,...o}):sock.emit('marker:add',{...o,x:+d.x,y:+d.y});closeBs();if(M.mode==='pin')mode('pin')}});

/* Upload do mapa (Mestre) */
$('#mup-b').onclick=()=>$('#mup').click();
function sendMap(m){Object.assign(M,m);sock.emit('map:set',m);setMap();if(m.w)fit()}
$('#mup').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,2400/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    const cell=num(prompt('Quantos pixels tem 1 quadrado (5 pés) neste mapa? Ajuste depois no botão ▦.',Math.round(w/30)))||50;
    sendMap({img:c.toDataURL('image/jpeg',.82),w,h,cell});toast('Mapa enviado aos jogadores')};
    im.onerror=()=>toast('Imagem inválida. Use JPG ou PNG.');im.src=r.result};r.readAsDataURL(f)};
$('#cel').onclick=()=>{const c=num(prompt('Tamanho de 1 quadrado (5 pés) em pixels do mapa:',M.cell));if(c>=8)sendMap({cell:c})};

/* ---- Eventos do servidor ---- */
const isP=()=>N.role==='player';
sock.on('player:update',p=>{const i=N.players.findIndex(x=>x.id===p.id);i<0?N.players.push(p):N.players[i]=p;renderDM();renderTok();if(dr===p.id)renderDr()});
sock.on('token:move',d=>{const p=N.players.find(x=>x.id===d.pid);if(p)p.tok={x:d.x,y:d.y};const el=$(`.tok[data-pid="${d.pid}"]`);if(el&&!(g?.t==='drag'&&g.pid===d.pid)){el.style.left=d.x+'px';el.style.top=d.y+'px'}});
sock.on('map:update',m=>{Object.assign(M,m);setMap();if(m.w||m.h)fit();if(isP()&&m.img!=null)toast('O Mestre atualizou o mapa')});
sock.on('marker:add',m=>{N.markers.push(m);renderMk();if(isP())toast('Novo marcador adicionado ao mapa: '+m.title)});
sock.on('marker:update',m=>{const i=N.markers.findIndex(x=>x.id===m.id);if(i>=0)N.markers[i]=m;renderMk();if(isP())toast('Marcador atualizado: '+m.title)});
sock.on('marker:remove',d=>{N.markers=N.markers.filter(x=>x.id!==d.id);renderMk();if(isP())toast('Um marcador foi removido do mapa')});
sock.on('sheet:patch',p=>{FX.patch(p);toast('O Mestre atualizou sua ficha!')});
sock.on('dm:status',d=>{if(isP())toast(d.online?'O Mestre voltou à mesa':'O Mestre se desconectou')});
sock.on('sheet:replace',d=>{quiet=true;try{FX.replace(d.sheet)}finally{quiet=false}toast('O Mestre atualizou sua ficha!')});

/* ---- Mestre: editar a ficha completa do jogador (usa a própria interface da ficha) ---- */
let ed=null,et,last=null;
const eb=document.createElement('div');eb.id='edb';eb.hidden=true;eb.innerHTML='<b id="edn"></b><button class="btn" id="edx">Concluir</button>';$('#v-sheet').prepend(eb);$('#edx').onclick=()=>endEdit();
function flush(){clearTimeout(et);if(!last||!ed)return;const o=JSON.parse(JSON.stringify(last));delete o.photo;delete o.thumb;last=null;sock.emit('dm:sheet',{pid:ed,sheet:o})}
function startEdit(pid){const p=N.players.find(x=>x.id===pid);if(!p)return;if(ed)endEdit();ed=pid;dr=null;$('#dr').classList.remove('on');
  FX.edit(p.sheet||{},s=>{last=s;clearTimeout(et);et=setTimeout(flush,250)});
  $('#edn').textContent='Editando: '+p.name;eb.hidden=false;$('#v-sheet').classList.add('ed');view('sheet')}
function endEdit(){flush();FX.end();ed=null;eb.hidden=true;$('#v-sheet').classList.remove('ed');view('dm')}

/* ---- Salvar e restaurar mesa (backup em arquivo) ---- */
$('#svb').onclick=()=>{const data={v:2,app:'mesa-dnd',code:N.code,savedAt:new Date().toISOString(),players:N.players.map(p=>({id:p.id,name:p.name,avatar:p.avatar||'',sheet:p.sheet||null,tok:p.tok||null})),markers:N.markers,map:{img:M.img,w:M.w,h:M.h,cell:M.cell}};
  const b=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`mesa-${N.code}-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Mesa salva no celular')};
$('#rb').onclick=()=>$('#rf').click();
$('#rf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
  r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(x){return err('Arquivo inválido.')}
    if(!d||d.app!=='mesa-dnd'||!/^[A-Z0-9]{4}$/.test(d.code||''))return err('Este arquivo não é um backup de mesa.');
    sock.emit('room:restore',d,res=>{if(!res?.ok)return err(res?.error||'Não foi possível restaurar.');
      N.code=res.code;N.role='dm';N.token=res.token;N.pid=null;store();enter(res.state);toast('Mesa restaurada! Os jogadores podem entrar de novo.')})};
  r.readAsText(f)};

/* ---- Instalar app (PWA) ---- */
let dp;const bi=$('#btnInstall');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;bi.classList.remove('hidden')});
window.addEventListener('appinstalled',()=>bi.classList.add('hidden'));
bi.onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;bi.classList.add('hidden')};
})();

</script>
